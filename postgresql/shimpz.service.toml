schema_version = 1
id = "postgresql"
title = "PostgreSQL"
version = "3.0.0"
summary = "One managed PostgreSQL database isolated per Hosted Team."
interface = "shimpz.postgresql/v1"
scope = "space"
credential_policy = "managed"
data_plane = "direct"
port = 7072
health_path = "/healthz"
metadata_path = "/v1/service"

[capabilities]
operations = [
  "team.provision",
  "team.finalize",
  "team.drop",
]
